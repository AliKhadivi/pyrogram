name: Layer 228 Port

on:
  push:
    branches:
      - agent/layer-228

permissions:
  contents: write

jobs:
  port-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[layer228-generated]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch known-good Layer 228 port
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/pyrogrammod
          git init /tmp/pyrogrammod
          git -C /tmp/pyrogrammod remote add origin https://github.com/PyrogramMod/PyrogramMod.git
          git -C /tmp/pyrogrammod fetch --depth=1 origin 5734fafa1cb1c0dc4c52bf32048d1e40cdcc2a03
          git -C /tmp/pyrogrammod checkout --detach FETCH_HEAD

      - name: Port compiler and generated raw API
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf compiler/api pyrogram/raw
          cp -a /tmp/pyrogrammod/compiler/api compiler/api
          cp -a /tmp/pyrogrammod/pyrogram/raw pyrogram/raw
          grep -q '^// LAYER 228$' compiler/api/source/main_api.tl

      - name: Install build and test dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r dev-requirements.txt

      - name: Regenerate API and errors
        shell: bash
        run: |
          set -euxo pipefail
          python -c "from compiler.api import compiler; compiler.start()"
          python -c "from compiler.errors import compiler; compiler.start()"
          python -m compileall -q pyrogram/raw pyrogram/errors

      - name: Verify Layer 228 raw API imports
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pyrogram import raw
          from pyrogram.raw.functions.langpack import GetLangPack, GetLanguage
          from pyrogram.raw.functions.communities import GetParticipantJoinedChats
          from pyrogram.raw.functions.ephemeral import SendMessage

          assert raw.all.layer == 228, raw.all.layer
          assert GetLangPack.ID
          assert GetLanguage.ID
          assert GetParticipantJoinedChats.ID == 0xF87EABAB
          assert SendMessage.ID == 0x68CBD09F
          print('Layer:', raw.all.layer)
          print('langpack.GetLangPack:', hex(GetLangPack.ID))
          print('communities.GetParticipantJoinedChats:', hex(GetParticipantJoinedChats.ID))
          print('ephemeral.SendMessage:', hex(SendMessage.ID))
          PY

      - name: Build wheel
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build dist *.egg-info
          python setup.py bdist_wheel
          ls -lh dist/

      - name: Run test suite
        shell: bash
        env:
          PYTHONWARNINGS: ignore
        run: |
          set -euxo pipefail
          python -m pytest -q

      - name: Commit generated Layer 228 port
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A compiler/api pyrogram/raw pyrogram/errors
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Update MTProto API to Layer 228 [layer228-generated]'
          git push origin HEAD:agent/layer-228
