name: Full Validation

on:
  push:
    branches:
      - agent/ci-full-validation
  workflow_dispatch:

concurrency:
  group: pyrogram-full-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r dev-requirements.txt
          python -m pip install pyright ruff

      - name: Regenerate Layer 228 API
        run: |
          rm -rf pyrogram/raw/types pyrogram/raw/functions pyrogram/raw/base pyrogram/raw/all.py pyrogram/errors/exceptions
          python -c "from compiler.api import compiler as api_compiler; from compiler.errors import compiler as errors_compiler; api_compiler.start(); errors_compiler.start()"
          python scripts/normalize_generated_typing.py

      - name: Modernize legacy typing
        run: python scripts/modernize_legacy_typing.py

      - name: Capture generated source diff
        id: idempotence
        continue-on-error: true
        shell: bash
        run: |
          git diff -- pyrogram > regeneration-diff.patch
          git diff --exit-code -- pyrogram

      - name: Upload regeneration diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regeneration-diff
          path: regeneration-diff.patch

      - name: Fail if generated sources differ
        if: always()
        run: test "${{ steps.idempotence.outcome }}" = success
