name: Full Validation

on:
  push:
    branches:
      - agent/ci-full-validation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r dev-requirements.txt
          python -m pip install pyright ruff

      - name: Regenerate Layer 228 API
        run: |
          rm -rf pyrogram/raw/types pyrogram/raw/functions pyrogram/raw/base pyrogram/raw/all.py pyrogram/errors/exceptions
          python -c "from compiler.api import compiler as api_compiler; from compiler.errors import compiler as errors_compiler; api_compiler.start(); errors_compiler.start()"
          python scripts/normalize_generated_typing.py

      - name: Modernize legacy typing
        run: python scripts/modernize_legacy_typing.py

      - name: Verify generated layer
        run: python -c "from pyrogram.raw import all; assert all.layer == 228, all.layer; print('Layer:', all.layer)"

      - name: Compile all Python sources
        run: python -m compileall -q pyrogram compiler scripts tests

      - name: Check stale raw API references
        id: rawrefs
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_raw_api_refs.py 2>&1 | tee rawrefs.txt

      - name: Ruff critical checks
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check pyrogram compiler scripts tests --select E9,F63,F7,F82 2>&1 | tee ruff.txt

      - name: Pyright
        id: pyright
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pyright pyrogram 2>&1 | tee pyright.txt

      - name: Run tests
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.txt

      - name: Runtime smoke test
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee smoke.txt
          import asyncio
          from pyrogram import Client, raw
          from pyrogram.raw import all
          from pyrogram.types import EmojiStatus

          assert all.layer == 228
          assert hasattr(raw.types, 'EmojiStatus')
          assert not hasattr(raw.types, 'EmojiStatusUntil')

          parsed = EmojiStatus._parse(None, raw.types.EmojiStatus(document_id=123, until=456))
          assert parsed is not None
          assert parsed.custom_emoji_id == 123
          assert parsed.until_date is not None

          written = EmojiStatus(custom_emoji_id=123).write()
          assert isinstance(written, raw.types.EmojiStatus)

          loop = asyncio.new_event_loop()
          asyncio.set_event_loop(loop)
          client = Client('ci-smoke', api_id=1, api_hash='0' * 32, in_memory=True)
          assert client.device_model == 'Jalgo Desktop'
          assert client.app_version.startswith('Jalgo Desktop ')
          client.executor.shutdown(wait=False)
          asyncio.set_event_loop(None)
          loop.close()
          print('Runtime smoke test passed')
          PY

      - name: Save typing diff
        if: always()
        run: git diff -- pyrogram > typing-modernization.patch

      - name: Persist validated typing cleanup
        if: ${{ steps.rawrefs.outcome == 'success' && steps.ruff.outcome == 'success' && steps.pytest.outcome == 'success' && steps.smoke.outcome == 'success' }}
        run: |
          if git diff --quiet -- pyrogram; then
            echo "No source typing changes to persist."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pyrogram
            git commit -m "Modernize generated and legacy typing"
            git push origin HEAD:agent/ci-full-validation
          fi

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-output
          path: |
            rawrefs.txt
            ruff.txt
            pyright.txt
            pytest.txt
            smoke.txt
            typing-modernization.patch

      - name: Fail if any validation failed
        if: always()
        run: |
          echo "rawrefs=${{ steps.rawrefs.outcome }}"
          echo "ruff=${{ steps.ruff.outcome }}"
          echo "pyright=${{ steps.pyright.outcome }}"
          echo "pytest=${{ steps.pytest.outcome }}"
          echo "smoke=${{ steps.smoke.outcome }}"
          test "${{ steps.rawrefs.outcome }}" = success
          test "${{ steps.ruff.outcome }}" = success
          test "${{ steps.pyright.outcome }}" = success
          test "${{ steps.pytest.outcome }}" = success
          test "${{ steps.smoke.outcome }}" = success
