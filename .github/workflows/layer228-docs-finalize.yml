name: Layer 228 Docs Finalize

on:
  push:
    branches:
      - agent/layer-228

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[layer228-docs-finalized]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make bundled API docs deterministic
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('compiler/api/compiler.py')
          source = path.read_text(encoding='utf-8')
          old = '''try:\n    with open("docs.json") as f:\n        docs = json.load(f)\nexcept FileNotFoundError:\n    try:\n        with urllib.request.urlopen("https://github.com/PyrogramMod/PyrogramMod/raw/refs/heads/main/compiler/api/docs.json") as r:\n            docs = json.load(r)\n    except (urllib.error.URLError, json.JSONDecodeError):\n        docs = {\n            "type": {},\n            "constructor": {},\n            "method": {}\n        }\n'''
          new = '''try:\n    with open(HOME_PATH / "docs.json") as f:\n        docs = json.load(f)\nexcept (FileNotFoundError, json.JSONDecodeError):\n    try:\n        with urllib.request.urlopen("https://github.com/PyrogramMod/PyrogramMod/raw/refs/heads/main/compiler/api/docs.json") as r:\n            docs = json.load(r)\n    except (urllib.error.URLError, json.JSONDecodeError):\n        docs = {\n            "type": {},\n            "constructor": {},\n            "method": {}\n        }\n'''
          if old not in source:
              raise SystemExit('Expected docs loader block was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify bundled docs load without network fallback
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import importlib
          import json
          import urllib.request
          from pathlib import Path
          from unittest.mock import patch

          local_docs = json.loads(Path('compiler/api/docs.json').read_text(encoding='utf-8'))
          assert local_docs['method'], 'Bundled method docs are empty'
          assert local_docs['constructor'], 'Bundled constructor docs are empty'
          assert local_docs['type'], 'Bundled type docs are empty'

          import compiler.api.compiler as api_compiler
          with patch.object(urllib.request, 'urlopen', side_effect=AssertionError('network fallback used')):
              api_compiler = importlib.reload(api_compiler)

          assert api_compiler.docs == local_docs, 'Compiler did not load bundled docs.json'
          print('Bundled docs:', {
              'methods': len(local_docs['method']),
              'constructors': len(local_docs['constructor']),
              'types': len(local_docs['type']),
          })
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r dev-requirements.txt

      - name: Regenerate Layer 228 API and errors
        shell: bash
        run: |
          set -euxo pipefail
          python -c "from compiler.api import compiler; compiler.start()"
          python -c "from compiler.errors import compiler; compiler.start()"
          python -m compileall -q pyrogram/raw pyrogram/errors

      - name: Verify Layer 228 API and documented docstrings
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from pyrogram import raw
          from pyrogram.raw.functions.langpack import GetLangPack, GetLanguage
          from pyrogram.raw.functions.communities import GetParticipantJoinedChats
          from pyrogram.raw.functions.ephemeral import SendMessage

          assert raw.all.layer == 228, raw.all.layer
          assert GetLangPack.ID == 0xF2F2330A
          assert GetLanguage.ID
          assert GetParticipantJoinedChats.ID == 0xF87EABAB
          assert SendMessage.ID == 0x68CBD09F

          docs = json.loads(Path('compiler/api/docs.json').read_text(encoding='utf-8'))
          documented = 0
          for qualname, meta in docs['method'].items():
              desc = (meta.get('desc') or '').strip()
              if desc:
                  documented += 1
          assert documented > 100, documented

          # The generator must produce real documentation, not only fallback text.
          generated_files = list(Path('pyrogram/raw/functions').rglob('*.py'))
          assert generated_files, 'No raw functions generated'
          rich_files = 0
          for p in generated_files:
              text = p.read_text(encoding='utf-8')
              if 'Telegram API function.' not in text:
                  rich_files += 1
          assert rich_files > 100, rich_files

          print('Layer:', raw.all.layer)
          print('Documented methods in bundled docs:', documented)
          print('Generated functions with non-fallback docs:', rich_files)
          PY

      - name: Build wheel
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build dist *.egg-info
          python setup.py bdist_wheel
          ls -lh dist/

      - name: Run tests
        shell: bash
        env:
          PYTHONWARNINGS: ignore
        run: |
          set -euxo pipefail
          python -m pytest -q

      - name: Commit compiler fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiler/api/compiler.py
          if git diff --cached --quiet; then
            echo 'No compiler changes to commit.'
            exit 0
          fi
          git commit -m 'Use bundled API docs for Layer 228 [layer228-docs-finalized]'
          git push origin HEAD:agent/layer-228
