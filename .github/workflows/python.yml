name: Pyrogram Smoke Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r dev-requirements.txt

      - name: Generate MTProto API
        run: |
          python -c "from compiler.api import compiler as api_compiler; from compiler.errors import compiler as errors_compiler; api_compiler.start(); errors_compiler.start()"

      - name: Verify Layer and Jalgo Desktop metadata
        run: |
          python -c "from pyrogram.raw import all; assert all.layer == 228, all.layer; from pyrogram import Client; c = Client('ci', api_id=1, api_hash='0' * 32, in_memory=True); assert c.app_version.startswith('Jalgo Desktop '), c.app_version; assert c.device_model == 'Jalgo Desktop', c.device_model; assert 'Pyrogram' not in c.app_version; assert 'Python' not in c.device_model; c.executor.shutdown(wait=False)"

      - name: Run smoke tests
        run: python -m pytest -q tests/test_jalgo_client.py tests/test_file_id.py
